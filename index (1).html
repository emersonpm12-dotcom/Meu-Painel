<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1d4ed8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Painel">
<title>Meu Painel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f1f5fb;--card:#fff;--tx:#0f1b2d;--mut:#64748b;--bd:#dbe3ee;--ac:#1d4ed8;--acx:#fff;--pos:#16a34a;--neg:#dc2626;--bar:#dbe6f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e8eefb;--mut:#94a3b8;--bd:#223049;--ac:#60a5fa;--acx:#0b1220;--pos:#4ade80;--neg:#f87171;--bar:#1f2e47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e8eefb;--mut:#94a3b8;--bd:#223049;--ac:#60a5fa;--acx:#0b1220;--pos:#4ade80;--neg:#f87171;--bar:#1f2e47;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px 14px 92px;max-width:560px;margin:0 auto;-webkit-text-size-adjust:100%}
h1{font-size:22px;margin:4px 2px 14px}
h2{font-size:16px;margin:18px 2px 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.g3 .c{margin:0;padding:10px}
small{color:var(--mut);display:block;font-size:12px}
.n{font-variant-numeric:tabular-nums;font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;text-transform:capitalize}
input,select,button,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;font-size:16px}
.r{display:flex;gap:8px}.r>*{flex:1;min-width:0}
button{background:var(--bar);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);font-weight:700;width:100%}
button.x{background:none;color:var(--mut);padding:4px 8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row>.t{flex:1;min-width:0}
.bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:none;padding:0;color:var(--acx);flex:none}
.chk.on{background:var(--ac)}
.done{text-decoration:line-through;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:14px 6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;font-size:10px;color:var(--mut);padding:6px 0;position:relative}
.tabs button b{display:block;font-size:18px}
.tabs button.on{color:var(--ac);font-weight:700}
.bd{position:absolute;top:0;right:8px;background:var(--neg);color:#fff;border-radius:9px;font-size:11px;min-width:18px;line-height:18px;padding:0 5px}
.warn{border-color:var(--neg);color:var(--neg);font-size:14px}
.ev{cursor:pointer}
button[data-a="edit"]{display:none}
.row:has([data-a="edit"]){cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .cw{text-align:center;font-size:10px}
.cd{min-height:46px;border:1px solid var(--bd);border-radius:8px;padding:2px 3px;font-size:9px;line-height:1.15;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.cd b{font-size:11px;font-weight:600}
.cd span{font-weight:700;font-variant-numeric:tabular-nums}
.cd.hoje{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.cd.sel{background:var(--bar)}
.cd span.pg{color:var(--ac)}
.or{color:#f97316}
.ei{width:110px;margin:0;padding:6px 8px;text-align:right}
.hero{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.ib{position:relative;width:40px;height:40px;border-radius:50%;padding:0;background:var(--card);border:1px solid var(--bd);flex:none;font-size:18px}
.ib .bd{top:-4px;right:-4px}
.alert{background:linear-gradient(120deg,#c2410c,#f97316);color:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.alert small{color:#fff;opacity:.9}
.alert button.w{background:#fff;color:#111;flex:none;padding:8px 12px;font-size:14px}
.alert button.w.g{background:rgba(255,255,255,.25);color:#fff}
.dk{background:#0b1830;color:#fff;border-color:#0b1830}
.dk small{color:#9fb3d1}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c,var(--ac)) calc(var(--p)*1%),#31425f 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:#0b1830;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.r>.ring{flex:none}
.bars{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.bars>div{flex:1;text-align:center;min-width:0}
.bars i{display:block;border-radius:8px}
.bars b{display:block;font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{border-left:4px solid #f97316;padding-left:8px}
.av{box-shadow:0 0 0 3px #f97316}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" id="tabs"></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{v=String(v).trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td=iso(new Date());
const val=id=>document.getElementById(id).value;
const clr=(...ids)=>ids.forEach(i=>{const e=document.getElementById(i);if(e)e.value=''});
const CATS=['Salário','Renda extra','Acréscimos','Cartões','Empréstimos','Fixo','Mercado','Pessoal','Estudos','Lazer','Imposto','Moradia','Alimentação','Transporte','Saúde','Contas','Educação','Outros'];
let cv='lista',cm='',hq='',EK=null,so='d',sa=1,dayf='',fk='d',fl='',tab='ini',mon=td.slice(0,7),db=null,canW=true,msg='Sincronizando…',uapi=null,uid=null;const ppl={};
let meN='';try{meN=localStorage.getItem('mp_who')||''}catch(e){}
const who=x=>{if(!x.by||/^u_/.test(x.by))return '';return x.by===meN?'você':esc(x.by)};
const S={tx:[],goals:[],items:[],deps:[],opts:[],inv:[],tar:[],orc:[],cards:[],fat:[],cmp:[],cfg:[]};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const pt=()=>S.tar.filter(x=>!x.ok&&x.d&&x.d<=td).length;
const dm=d=>d.split('-').reverse().slice(0,2).join('/');
let dis='';try{dis=localStorage.getItem('mp_dis')||''}catch(e){}
try{const th=localStorage.getItem('mp_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
const dim=(y,m)=>new Date(y,m,0).getDate();
const pad=n=>String(n).padStart(2,'0');
function addm(d,k){let [y,m,dd]=d.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12)+1;return y+'-'+pad(m)+'-'+pad(Math.min(dd,dim(y,m)))}
function cyc(c,d){
  let [y,m,dd]=d.split('-').map(Number);
  if(dd>=c.f){m++;if(m>12){m=1;y++}}
  const fech=y+'-'+pad(m)+'-'+pad(Math.min(c.f,dim(y,m)));
  let vy=y,vm=m;if(c.v<=c.f){vm++;if(vm>12){vm=1;vy++}}
  return {fech,venc:vy+'-'+pad(vm)+'-'+pad(Math.min(c.v,dim(vy,vm)))};
}
function faturas(mn){
  const out={};
  S.tx.filter(t=>t.cd).forEach(t=>{
    const c=S.cards.find(x=>x.id===t.cd);if(!c)return;
    const r=cyc(c,t.d);if(r.venc.slice(0,7)!==mn)return;
    const id=c.id+'-'+r.venc.slice(0,7).replace('-','');
    const o=out[id]||(out[id]={id,n:c.n,g:c.g||'p',venc:r.venc,fech:r.fech,total:0,items:[],paid:!!(S.fat.find(x=>x.id===id)||{}).paid});
    o.total+=t.v;o.items.push(t);
  });
  return Object.values(out).sort((a,b)=>a.venc.localeCompare(b.venc));
}

const slug=s=>s.normalize('NFD').replace(/[^a-zA-Z0-9]/g,'');
const nb=v=>String(v==null?'':v).replace('.',',');
const cmpf=(a,b)=>sa*(a.d.localeCompare(b.d)||(a.t||a.c).localeCompare(b.t||b.c,'pt'));
const osel=(a,v)=>a.concat(a.includes(v)?[]:[v]).map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('');
function edform(co,x){
  const i=(id,ph,v,ex)=>`<input id="e-${id}" placeholder="${ph}" value="${esc(v==null?'':v)}" ${ex||''}>`;
  const dt=v=>`<input id="e-d" type="date" value="${esc(v||'')}">`;
  let h='';
  if(co==='tx')h=i('t','Descrição',x.t)+`<div class="r">${i('v','Valor (R$)',nb(x.v),'inputmode="decimal"')}${dt(x.d)}</div><select id="e-c">${osel(CATS,x.c)}</select><select id="e-s"><option value="p" ${x.st!=='n'?'selected':''}>${x.k==='r'?'Recebido':'Pago'}</option><option value="n" ${x.st==='n'?'selected':''}>${x.k==='r'?'A receber':'Pendente'}</option></select>${x.k==='d'&&!x.cd?`<select id="e-g"><option value="p" ${(x.pg||'p')==='p'?'selected':''}>Pagamento</option><option value="v" ${x.pg==='v'?'selected':''}>Vale</option></select>`:''}`;
  else if(co==='inv')h=i('t','Ativo',x.t)+`<div class="r">${i('v','Valor (R$)',nb(x.v),'inputmode="decimal"')}${dt(x.d)}</div>`;
  else if(co==='tar')h=i('t','Tarefa',x.t)+`<div class="r">${dt(x.d)}<select id="e-r">${osel(['Emerson','Carol','Os dois'],x.r)}</select></div>`;
  else if(co==='goals')h=i('t','Meta',x.t)+`<div class="r">${i('v','Valor alvo (opcional)',x.alvo?nb(x.alvo):'','inputmode="decimal"')}${dt(x.p)}</div>`;
  else if(co==='items')h=`<div class="r"><input id="e-t" style="flex:3" placeholder="Item" value="${esc(x.n)}"><input id="e-q" inputmode="decimal" placeholder="Qtd" value="${x.q}"></div>`;
  else if(co==='opts')h=`<div class="r">${i('t','Marca',x.m)}${i('v','Preço (R$)',nb(x.p),'inputmode="decimal"')}</div>`;
  return h+`<div class="r"><button class="p" data-a="saveed">Salvar</button><button data-a="canceled">Cancelar</button></div>`;
}
function showEd(){
  if(!EK)return;
  const [co,id]=EK.split('|');
  const x=(S[co]||[]).find(y=>y.id===id);
  const b=document.querySelector(`[data-a="edit"][data-id="${EK}"]`);
  if(!x||!b)return;
  const row=b.closest('.row')||b.closest('.c');
  row.style.display='block';row.innerHTML=edform(co,x);
}
function fatblock(fs){
  if(!fs.length)return '';
  return '<h2>Faturas dos cartões</h2>'+fs.map(f=>`<div class="c"><div class="row" style="border:0;padding:0"><button class="chk ${f.paid?'on':''}" data-a="paidf" data-id="${f.id}">${f.paid?'✓':''}</button><div class="t"><b>${esc(f.n)}</b><small>vence ${dm(f.venc)} · fecha ${dm(f.fech)} · ${f.g==='v'?'Vale':'Pagamento'} · ${f.paid?'paga':'em aberto'}</small></div><span class="n neg">${R(f.total)}</span></div>${f.items.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>`<div class="row"><div class="t"><div><span class="ev" data-ed="tx|${t.id}|t" data-t="text" data-v="${esc(t.t||'')}">${esc(t.t||t.c)}</span></div><small><span class="ev" data-ed="tx|${t.id}|d" data-t="date" data-v="${t.d}">${dm(t.d)}</span>${who(t)?' · '+who(t):''}</small></div><span class="n ev" data-ed="tx|${t.id}|v" data-v="${t.v}">${R(t.v)}</span><button class="x" data-a="edit" data-id="tx|${t.id}">✏️</button><button class="x" data-a="deltx" data-id="${t.id}">✕</button></div>`).join('')}</div>`).join('');
}
function cardsblock(){
  const cs=S.cards.slice().sort((a,b)=>a.n.localeCompare(b.n));
  return `<div class="c"><input id="k-n" placeholder="Nome do cartão (ex.: Nubank Emerson)"><div class="r"><input id="k-f" inputmode="numeric" placeholder="Fecha dia"><input id="k-v" inputmode="numeric" placeholder="Vence dia"></div><select id="k-g"><option value="p">Pagamento</option><option value="v">Vale</option></select><button class="p" data-a="addcard">Cadastrar cartão</button><small style="margin-top:8px">Compras feitas no dia do fechamento ou depois entram na próxima fatura.</small></div>`+(cs.length?cs.map(c=>{const r=cyc(c,td);const tot=sum(S.tx.filter(t=>t.cd===c.id&&cyc(c,t.d).venc===r.venc),t=>t.v);return `<div class="c"><div class="row" style="border:0;padding:0"><div class="t"><b>${esc(c.n)}</b><small>fecha dia ${c.f} · vence dia ${c.v} · ${c.g==='v'?'Vale':'Pagamento'}</small></div><button class="x" data-a="delcard" data-id="${c.id}">✕</button></div><small>Fatura atual: ${R(tot)} · fecha ${dm(r.fech)} · vence ${dm(r.venc)}</small></div>`}).join(''):'<div class="empty">Nenhum cartão cadastrado.</div>');
}
function calblock(l,fs){
  const [y,m]=mon.split('-').map(Number),n=dim(y,m),off=new Date(y,m-1,1).getDay(),M={};
  const add=(d,k,v)=>{const o=M[d]||(M[d]={d:0,r:0,q:0,ra:0});o[k]+=v};
  l.forEach(t=>add(t.d,t.k==='r'?(t.st==='n'?'ra':'r'):(t.st==='n'?'d':'q'),t.v));
  fs.forEach(f=>add(f.venc,f.paid?'q':'d',f.total));
  const fm=v=>Math.round(v).toLocaleString('pt-BR');
  let cells=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<small class="cw">${x}</small>`).join('');
  for(let i=0;i<off;i++)cells+='<i></i>';
  for(let d=1;d<=n;d++){const k=mon+'-'+pad(d),o=M[k];
    cells+=`<div class="cd${k===td?' hoje':''}${dayf===k?' sel':''}" data-a="day" data-id="${k}"><b>${d}</b>${o&&o.r?`<span class="pos">+${fm(o.r)}</span>`:''}${o&&o.ra?`<span class="or">+${fm(o.ra)}</span>`:''}${o&&o.d?`<span class="neg">${fm(o.d)}</span>`:''}${o&&o.q?`<span class="pg">${fm(o.q)}</span>`:''}</div>`}
  return `<h2>Calendário</h2><div class="c"><div class="cal">${cells}</div>${dayf?`<div class="r" style="margin-top:8px;align-items:center"><small>Mostrando só o dia ${dm(dayf)}</small><button data-a="day" data-id="${dayf}" style="flex:none">Limpar</button></div>`:'<small style="margin-top:6px">Toque num dia para ver só os lançamentos dele. Azul = pago, vermelho = a pagar, verde = recebido, laranja = a receber.</small>'}</div>`;
}
function catblock(cat){
  const keys=[...new Set([...Object.keys(cat),...S.orc.map(o=>o.c)])];
  keys.sort((a,b)=>(cat[b]||0)-(cat[a]||0));
  const bud=c=>{const o=S.orc.find(x=>x.c===c);return o?o.v:0};
  return `<h2>Despesas por categoria</h2><div class="c"><div class="r"><select id="o-c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="o-v" inputmode="decimal" placeholder="Previsão mensal (R$)"></div><button class="p" data-a="setorc">Definir previsão da categoria</button></div>${keys.length?`<div class="c">${keys.map(c=>{const v=cat[c]||0,b=bud(c),pct=b?Math.min(100,Math.round(v/b*100)):(v?100:0);return `<div><div class="r"><span>${esc(c)}</span><span class="n" style="text-align:right">${R(v)}${b?' de '+R(b):''}</span></div><div class="bar"><i style="width:${pct}%;${b&&v>b?'background:var(--neg)':''}"></i></div>${b&&v>b?`<small class="neg">Passou ${R(v-b)} da previsão</small>`:''}</div>`}).join('')}</div>`:''}`;
}

function mres(m){
  const l=S.tx.filter(t=>(t.d||'').slice(0,7)===m&&!t.cd),fa=faturas(m),ds=l.filter(t=>t.k==='d');
  const cat={};ds.forEach(t=>cat[t.c]=(cat[t.c]||0)+t.v);fa.forEach(f=>cat['Cartões']=(cat['Cartões']||0)+f.total);
  return {rec:sum(l.filter(t=>t.k==='r'),t=>t.v),rp:sum(l.filter(t=>t.k==='r'&&t.st==='n'),t=>t.v),des:sum(ds,t=>t.v)+sum(fa,f=>f.total),pend:sum(ds.filter(t=>t.st==='n'),t=>t.v)+sum(fa.filter(f=>!f.paid),f=>f.total),cat,n:l.length+fa.length};
}
function pends(){
  const out=[];
  S.tx.filter(t=>t.k==='d'&&t.st==='n'&&!t.cd).forEach(t=>out.push({n:t.t||t.c,d:t.d,v:t.v}));
  const y=+td.slice(0,4),mo=+td.slice(5,7);
  for(let k=-1;k<=2;k++){const x=new Date(y,mo-1+k,1);faturas(x.getFullYear()+'-'+pad(x.getMonth()+1)).filter(f=>!f.paid).forEach(f=>out.push({n:'Fatura '+f.n,d:f.venc,v:f.total}))}
  return out.sort((a,b)=>a.d.localeCompare(b.d));
}
function ini(){
  const r=mres(mon),P=pends(),late=P.filter(x=>x.d<td);
  const d1=new Date();d1.setDate(d1.getDate()+1);const tm=iso(d1);
  const tk=S.tar.filter(x=>!x.ok).sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999')||a.ts-b.ts);
  const tl=tk.filter(x=>x.d&&x.d<td).length,nt=tk.filter(x=>x.d&&x.d<=tm).length,nc=P.filter(x=>x.d<=tm).length,al=nt+nc,dn=S.tar.length-tk.length;
  let sc=null,lab='';
  if(r.rec>0){sc=100;const p=(r.rec-r.des)/r.rec;if(p<0)sc-=30;else if(p<.1)sc-=15;sc-=Math.min(40,late.length*10)+Math.min(20,tl*5);sc=Math.max(0,sc);lab=sc>=80?'Saudável':sc>=60?'Atenção':'Crítico'}
  const ring=(p,c)=>{p=Math.max(0,Math.min(100,p));return `<div class="ring" style="--p:${p};--c:${c||'var(--ac)'}"><span>${p}%</span></div>`};
  const [y,m]=mon.split('-'),nome=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const cs=Object.entries(r.cat).sort((a,b)=>b[1]-a[1]).slice(0,4),mx=cs.length?cs[0][1]:1,cols=['#2563eb','#f97316','#60a5fa','#fdba74'];
  const est=sum(S.items.filter(i=>!i.ok),i=>{const o=S.opts.filter(x=>x.i===i.id).map(x=>x.p);return (o.length?Math.min(...o):(lastp(i.n)||{p:0}).p)*i.q});
  const ap=sum(S.inv.filter(x=>x.k==='a'&&(x.d||'').slice(0,7)===mon),x=>x.v),sal=r.rec-r.des,RV=S.tx.filter(x=>x.k==='r'&&x.st==='n').sort((a,b)=>a.d.localeCompare(b.d));

const SUPABASE_URL='COLE_AQUI_A_URL_DO_PROJETO';
const SUPABASE_KEY='COLE_AQUI_A_CHAVE_ANON_PUBLICA';
let sb=null,sbEmail='',loaded=false;
const store={},subs={};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const snapOf=c=>({docs:[...(store[c]||new Map()).entries()].map(([id,d])=>({id,data:()=>d})),metadata:{fromCache:false}});
function applyLocal(c,id,d){const m=store[c]||(store[c]=new Map());if(d===null)m.delete(id);else m.set(id,d);(subs[c]||[]).forEach(cb=>cb(snapOf(c)))}
function docRef(c,id){return {id,
  set:async d=>{const {error}=await sb.from('docs').upsert({coll:c,id,data:d,updated_at:new Date().toISOString()});if(error)throw error;applyLocal(c,id,d)},
  update:async u=>{const {error}=await sb.rpc('doc_update',{p_coll:c,p_id:id,p_patch:u});if(error)throw error;const cur=(store[c]&&store[c].get(id))||{};applyLocal(c,id,{...cur,...u})},
  delete:async()=>{const {error}=await sb.from('docs').delete().eq('coll',c).eq('id',id);if(error)throw error;applyLocal(c,id,null)}}}
const mkdb=()=>({collection:c=>({doc:id=>docRef(c,id||newId()),onSnapshot:cb=>{(subs[c]||(subs[c]=[])).push(cb);if(loaded)cb(snapOf(c))}}),doc:p=>{const [c,id]=p.split('/');return docRef(c,id)}});
async function load(){
  const fresh={};let from=0;
  for(;;){const {data,error}=await sb.from('docs').select('coll,id,data').order('coll').order('id').range(from,from+999);if(error)throw error;data.forEach(r=>{(fresh[r.coll]||(fresh[r.coll]=new Map())).set(r.id,r.data)});if(data.length<1000)break;from+=1000}
  Object.keys(store).forEach(k=>delete store[k]);Object.assign(store,fresh);
}
function loginView(t){
  document.getElementById('tabs').innerHTML='';
  document.getElementById('app').innerHTML=`<h1>Entrar</h1><div class="c"><input id="lg-e" type="email" autocomplete="username" placeholder="E-mail"><input id="lg-p" type="password" autocomplete="current-password" placeholder="Senha"><button class="p" id="lg-b">Entrar</button>${t?`<small class="neg" style="margin-top:8px">${esc(t)}</small>`:''}</div>`;
}
async function ensureSession(){
  let {data:{session}}=await sb.auth.getSession();
  while(!session){
    await new Promise(res=>{
      const bind=()=>{document.getElementById('lg-b').onclick=go;document.getElementById('lg-p').onkeydown=k=>{if(k.key==='Enter')go()}};
      const go=async()=>{
        const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('lg-e').value.trim(),password:document.getElementById('lg-p').value});
        if(error){loginView('E-mail ou senha incorretos.');bind();return}
        session=data.session;res();
      };
      loginView('');bind();
    });
  }
  return session;
}
(async()=>{
  if(SUPABASE_URL.startsWith('COLE')){document.getElementById('app').innerHTML='<div class="c warn">Falta configurar a URL e a chave do Supabase no início do arquivo index.html.</div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const session=await ensureSession();
  uid=session.user.id;sbEmail=session.user.email||'';
  render();
  try{await load()}catch(e){msg='Erro ao ler os dados: '+(e.message||e);render();return}
  loaded=true;
  sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.coll)return;
    applyLocal(r.coll,r.id,p.eventType==='DELETE'?null:r.data);
  }).subscribe();
  db=mkdb();
